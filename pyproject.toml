# Project Configuration & Packaging
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "egg-detection-and-segmentation"
version = "1.0.0"
description = "Computer Vision Assignment for Nosh Robotics: Pretrained Foundation Segmentation, Classical Image Processing Experiments (E1-E8), Overlap Metrics, and Video Identity Tracking."
authors = [{ name = "Saksham Chauhan" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "Pillow>=9.5.0",
    "matplotlib>=3.7.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[project.optional-dependencies]
foundation = [
    "transformers>=4.35.0",
    "timm>=0.9.0",
]
dev = [
    "pytest>=7.0.0",
]
